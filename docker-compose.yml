version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: zelos-redis
    ports:
      - "6379:6379" # Arch machine's port : container's port
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data: # Keeping data persistent since 2026